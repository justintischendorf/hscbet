version: 2

updates:
  # Bun packages (bun.lock) of the root and all workspaces
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor and patch updates, majors stay separate
      minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows (actions/checkout, setup-bun, ...)
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Base images of the Dockerfiles (oven/bun)
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /packages/worker
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      docker:
        patterns: ["*"]

  # Images in docker-compose-dev.yml and docker-compose-prod.yml (redis, ...)
  # Images tagged "latest" (minio) are skipped by Dependabot
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      docker-compose:
        patterns: ["*"]
