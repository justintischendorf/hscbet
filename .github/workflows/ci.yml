name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id "ci" is the required status check in the
  # "Protect main and develop" ruleset, so keep it unchanged.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Only needed for prisma generate, no database is created
      DATABASE_URL: file:./data/ci.db

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Build
        # apps/web/lib/auth-client.ts throws without it while prerendering
        env:
          NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:3001
        run: bun run build
